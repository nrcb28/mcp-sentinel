name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install locked dependencies
      run: npm ci --ignore-scripts --audit=false

    - name: Audit dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Run Test Suite
      run: npm test

    - name: Verify CLI Scan & SARIF Export
      run: node ./bin/mcp-sentinel.js scan --config ./test/fixtures/safe-config.json --sarif ./results.sarif --fail-on CRITICAL
