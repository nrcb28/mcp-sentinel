name: 'MCP-Sentinel Security Audit'
description: 'Audits Model Context Protocol (MCP) server configurations for security risks, secret leaks, and sandbox breakout vulnerabilities.'
author: 'Nicolás Riquelme Lozano'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  config:
    description: 'Path to MCP configuration file (defaults to auto-discovering all clients)'
    required: false
    default: ''
  fail-on:
    description: 'Exit with error if issues at or above this severity are detected [LOW, MEDIUM, HIGH, CRITICAL]'
    required: false
    default: 'HIGH'
  sarif:
    description: 'Output path for OASIS SARIF v2.1.0 report'
    required: false
    default: 'mcp-sentinel.sarif'
  html:
    description: 'Output path for visual HTML dashboard report'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run MCP-Sentinel
      shell: bash
      env:
        MCP_SENTINEL_CONFIG: ${{ inputs.config }}
        MCP_SENTINEL_FAIL_ON: ${{ inputs.fail-on }}
        MCP_SENTINEL_SARIF: ${{ inputs.sarif }}
        MCP_SENTINEL_HTML: ${{ inputs.html }}
      run: |
        set -euo pipefail
        ARGS=(scan)
        if [ -n "$MCP_SENTINEL_CONFIG" ]; then
          ARGS+=(--config "$MCP_SENTINEL_CONFIG")
        fi
        if [ -n "$MCP_SENTINEL_FAIL_ON" ]; then
          ARGS+=(--fail-on "$MCP_SENTINEL_FAIL_ON")
        fi
        if [ -n "$MCP_SENTINEL_SARIF" ]; then
          ARGS+=(--sarif "$MCP_SENTINEL_SARIF")
        fi
        if [ -n "$MCP_SENTINEL_HTML" ]; then
          ARGS+=(--html "$MCP_SENTINEL_HTML")
        fi
        node "${{ github.action_path }}/bin/mcp-sentinel.js" "${ARGS[@]}"
